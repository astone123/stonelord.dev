name: Build & Deploy

on: [push]

# One run per ref: queued main deploys never overlap, superseded branch builds cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build application
        run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ./dist
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Two-pass sync split by cache lifetime. The passes' filter sets are exact
      # complements, so together they cover every file and --delete in each pass
      # can only remove that pass's own class of files. A pattern added to the
      # includes below must also be added to the excludes of the second pass.
      # Assets go first so new HTML never references a not-yet-uploaded file.
      - name: Deploy hashed assets to S3 (immutable cache)
        run: >-
          aws s3 sync ./dist/ s3://${{ secrets.BUCKET_ID }} --delete
          --exclude "*"
          --include "_astro/*"
          --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.gif"
          --include "*.webp" --include "*.avif" --include "*.ico" --include "*.svg"
          --include "*.woff" --include "*.woff2"
          --cache-control "public, max-age=31536000, immutable"
      - name: Deploy HTML and remaining files to S3 (always revalidate)
        run: >-
          aws s3 sync ./dist/ s3://${{ secrets.BUCKET_ID }} --delete
          --exclude "_astro/*"
          --exclude "*.png" --exclude "*.jpg" --exclude "*.jpeg" --exclude "*.gif"
          --exclude "*.webp" --exclude "*.avif" --exclude "*.ico" --exclude "*.svg"
          --exclude "*.woff" --exclude "*.woff2"
          --cache-control "public, max-age=0, must-revalidate"
      - name: Create CloudFront invalidations
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID_WWW }} --paths "/*"
